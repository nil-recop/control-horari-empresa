const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_1VoCxRb15wE5fLnQS_tQBQ_kx1cGgKZ';

const ATTACHMENTS_BUCKET = 'justificants';

// Puja un fitxer al bucket PRIVAT "justificants".
async function uploadAttachment(file, folder) {
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${folder || 'general'}/${crypto.randomUUID()}-${safeName}`;
  const { error } = await supabaseClient.storage
    .from(ATTACHMENTS_BUCKET)
    .upload(path, file, { upsert: false, contentType: file.type });
  if (error) throw error;
  return { name: file.name, path };
}

// El bucket és privat (hi ha justificants mèdics): per veure'ls o
// descarregar-los cal sempre una URL signada temporal (10 minuts), mai un
// enllaç fix.
async function getSignedUrl(path, expiresIn = 600) {
  if (!path) return null;
  const { data, error } = await supabaseClient.storage
    .from(ATTACHMENTS_BUCKET)
    .createSignedUrl(path, expiresIn);
  if (error) { console.error(error); return null; }
  return data.signedUrl;
}

/* ============================= Helpers ============================= */
const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (s) => {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('ca-ES', { weekday: 'short', day: 'numeric', month: 'short' });
};
const fmtMoney = (n) => (Math.round((Number(n) + Number.EPSILON) * 100) / 100).toLocaleString('ca-ES', { style: 'currency', currency: 'EUR' });

function getWeekRange(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d); monday.setDate(d.getDate() - day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return [monday.toISOString().slice(0, 10), sunday.toISOString().slice(0, 10)];
}
function getMonthRange(ym) {
  const [y, m] = ym.split('-').map(Number);
  const first = `${ym}-01`;
  const lastDate = new Date(y, m, 0).getDate();
  return [first, `${ym}-${String(lastDate).padStart(2, '0')}`];
}
function getDayStatus(workerId, date, fitxatges, solicituds, assistencia, obraId) {
  const baixa = fitxatges.find(f => f.workerId === workerId && f.date === date && f.baixa);
  if (baixa) return { label: 'Baixa mèdica', kind: 'baixa', file: baixa.file };
  const sol = solicituds.find(s => s.workerId === workerId && s.status === 'aprovada' && date >= s.dateFrom && date <= s.dateTo);
  if (sol) return { label: sol.type === 'vacances' ? 'Vacances' : 'Permís', kind: 'permis', file: sol.file };
  const asis = assistencia.find(a => a.workerId === workerId && a.date === date && a.obraId === obraId);
  if (asis) return { label: asis.present ? 'Present' : 'Absent', kind: asis.present ? 'present' : 'absent' };
  const fit = fitxatges.find(f => f.workerId === workerId && f.date === date && !f.baixa && f.obraId === obraId);
  if (fit) return { label: 'Present (fitxat)', kind: 'present' };
  return { label: 'Sense marcar', kind: 'none' };
}

/* ============================= Login ============================= */
function PinPad({ value, onChange, onComplete }) {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
  return (
    <div>
      <div className="pin-dots">
        {[0, 1, 2, 3].map(i => <div key={i} className={`pin-dot ${value.length > i ? 'filled' : ''}`} />)}
      </div>
      <div className="pin-grid">
        {keys.map((k, i) => {
          if (k === '') return <div key={i} />;
          if (k === 'del') return <button key={i} type="button" className="pin-key" onClick={() => onChange(value.slice(0, -1))}>⌫</button>;
          return (
            <button key={i} type="button" className="pin-key" onClick={() => {
              if (value.length >= 4) return;
              const nv = value + k;
              onChange(nv);
              if (nv.length === 4) onComplete(nv);
            }}>{k}</button>
          );
        })}
      </div>
    </div>
  );
}

function LoginScreen({ workers, onLogin }) {
  const [selected, setSelected] = useState(null);
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const sortedWorkers = [...workers].sort((a, b) => a.name.localeCompare(b.name, 'ca'));

  const attempt = (code) => {
    if (!selected) return;
    if (code === selected.pin) {
      onLogin(selected);
    } else {
      setError('PIN incorrecte');
      setTimeout(() => { setPin(''); setError(''); }, 700);
    }
  };

  return (
    <div className="recop-app" style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <div className="stripe" />
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px 16px' }}>
        <div style={{ width: '100%', maxWidth: 380 }}>
          <div style={{ textAlign: 'center', marginBottom: 28 }}>
            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 10 }}><Logo size={64} /></div>
            <div style={{ fontSize: 13, color: '#6b6558', fontWeight: 600, letterSpacing: '.03em' }}>CONTROL HORARI D'OBRA</div>
          </div>

          {!selected ? (
            <div>
              <span className="label">Selecciona el teu nom</span>

                  <button key={w.id} className="worker-tile" onClick={() => setSelected(w)}>

                    <div style={{ fontWeight: 700, fontSize: 14 }}>{w.name}</div>

                ))}

                  <div style={{ fontSize: 13, color: '#8a8478', textAlign: 'center', padding: 16 }}>

                <ChevronLeft size={16} /> Canvia d'usuari

              <div style={{ textAlign: 'center', fontSize: 13, color: '#8a8478', marginBottom: 8 }}>Introdueix el teu PIN</div>
              <PinPad value={pin} onChange={setPin} onComplete={attempt} />
              {error && <div style={{ textAlign: 'center', color: BRAND.terracotta, fontWeight: 700, marginTop: 10, fontSize: 13 }}>{error}</div>}
            </div>
          )}

/* ============================= File attachments ============================= */
function FileAttach({ file, onChange, required, folder, accept = '.pdf,.png,.jpg,.jpeg,.heic' }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const handle = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    setBusy(true); setErr('');
    try {
      const uploaded = await uploadAttachment(f, folder);
      onChange(uploaded);
    } catch (error) {
      console.error(error);
      setErr("No s'ha pogut pujar el document. Torna-ho a provar.");
    } finally {
      setBusy(false);
    }
  };
  return (
    <div>
      <label className="file-drop">
        <input type="file" accept={accept} style={{ display: 'none' }} onChange={handle} disabled={busy} />
        <Upload size={18} style={{ margin: '0 auto 4px' }} />
        <div style={{ fontSize: 13, fontWeight: 600 }}>{busy ? 'Pujant…' : file ? 'Canvia el document' : 'Puja el justificant'}</div>
        <div style={{ fontSize: 11, color: '#8a8478' }}>PDF, PNG, JPG, JPEG o HEIC {required && '(obligatori)'}</div>
      </label>
      {file && <div className="chip" style={{ marginTop: 8 }}><Paperclip size={12} /> {file.name}</div>}
      {err && <div style={{ fontSize: 11, color: BRAND.terracotta, marginTop: 6 }}>{err}</div>}
    </div>
  );
}
function AttachmentViewer({ file }) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    let active = true;
    setUrl(null);
    if (file?.path) {
      getSignedUrl(file.path).then((u) => { if (active) setUrl(u); });
    }
    return () => { active = false; };
  }, [file?.path]);

  if (!file) return <span style={{ fontSize: 12, color: '#8a8478' }}>Sense justificant</span>;
  if (!url) return <span style={{ fontSize: 12, color: '#8a8478' }}>Carregant document…</span>;
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
      <a href={url} target="_blank" rel="noreferrer" className="btn btn-ghost" style={{ padding: '4px 10px', fontSize: 12 }}><Eye size={14} /> Veure</a>
      <a href={url} download={file.name} className="btn btn-ghost" style={{ padding: '4px 10px', fontSize: 12 }}><Download size={14} /> Descarrega</a>
    </div>
  );
}

/* ============================= Fitxatge (treballador + encarregat) ============================= */
function FitxatgeView({ user, obres, fitxatges, onSave }) {
  const [date, setDate] = useState(todayISO());
  const myObres = obres.filter(o => user.obraIds.includes(o.id));

  const load = (d) => fitxatges.find(f => f.workerId === user.id && f.date === d);
  const e0 = load(date);
  const [obraId, setObraId] = useState(e0?.obraId || myObres[0]?.id || '');
  const [hores, setHores] = useState(e0?.hours ?? 8);
  const [dieta, setDieta] = useState(e0?.dieta ?? false);
  const [desplacament, setDesplacament] = useState(e0?.desplacament ?? false);
  const [comment, setComment] = useState(e0?.comment ?? '');
  const [baixa, setBaixa] = useState(e0?.baixa ?? false);
  const [file, setFile] = useState(e0?.file ?? null);
  const [saved, setSaved] = useState(false);
  const [showBaixaAlert, setShowBaixaAlert] = useState(false);

  useEffect(() => {
    const e = load(date);
    setObraId(e?.obraId || myObres[0]?.id || '');
    setHores(e?.hours ?? 8);
    setDieta(e?.dieta ?? false);
    setDesplacament(e?.desplacament ?? false);
    setComment(e?.comment ?? '');
    setBaixa(e?.baixa ?? false);
    setFile(e?.file ?? null);
    setSaved(false);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [date]);

  const moveDate = (delta) => { const d = new Date(date + 'T00:00:00'); d.setDate(d.getDate() + delta); setDate(d.toISOString().slice(0, 10)); };
  const canSave = baixa ? true : !!obraId;
  const existing = load(date);

  const toggleBaixa = () => {
    const nv = !baixa;
    setBaixa(nv);
    if (nv) {
      setShowBaixaAlert(true);
      setTimeout(() => setShowBaixaAlert(false), 4500);
    } else {
      setFile(null);
    }
  };

  const save = () => {
    onSave({
      id: existing?.id,
      workerId: user.id,
      date,
      baixa,
      obraId: baixa ? null : obraId,
      hours: baixa ? 0 : Number(hores) || 0,
      dieta: baixa ? false : dieta,
      desplacament: baixa ? false : desplacament,
      comment: baixa ? '' : comment,
      file: file || null,
    });
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  };

  return (
    <div style={{ maxWidth: 520, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 16 }}>
      {showBaixaAlert && (
        <div style={{ position: 'fixed', top: 70, left: '50%', transform: 'translateX(-50%)', background: BRAND.black, color: '#fff', padding: '10px 16px', borderRadius: 10, fontSize: 13, fontWeight: 600, zIndex: 50, boxShadow: '0 8px 20px rgba(0,0,0,.35)', display: 'flex', alignItems: 'center', gap: 8, maxWidth: '90vw', textAlign: 'center' }}>
          <AlertCircle size={16} color={BRAND.terracotta} style={{ flexShrink: 0 }} />
          <span>Recorda justificar la baixa amb un document mèdic (avui o demà).</span>
        </div>
      )}
      <div className="card">
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12, gap: 10 }}>
          <button className="btn btn-ghost" style={{ padding: 6 }} onClick={() => moveDate(-1)}><ChevronLeft size={16} /></button>
          <div style={{ textAlign: 'center', flex: 1 }}>
            <div style={{ fontWeight: 800, fontSize: 15, textTransform: 'capitalize' }}>{fmtDate(date)}</div>
            <input type="date" className="input" style={{ marginTop: 6, textAlign: 'center' }} value={date} onChange={e => setDate(e.target.value)} />
          </div>
          <button className="btn btn-ghost" style={{ padding: 6 }} onClick={() => moveDate(1)}><ChevronRight size={16} /></button>
        </div>
        <button className="btn" style={{ width: '100%', justifyContent: 'flex-start', background: '#f1ede4' }} onClick={() => setDate(todayISO())}>
          <Calendar size={16} /> Anar a avui
        </button>
      </div>

      <div className="card">
        <div className="toggle-row">
          <div>
            <div style={{ fontWeight: 700, fontSize: 14 }}>Estic de baixa</div>
            <div style={{ fontSize: 12, color: '#8a8478' }}>Marca-ho si aquest dia estàs de baixa mèdica</div>
          </div>
          <button onClick={toggleBaixa} style={{ background: 'none', border: 'none', cursor: 'pointer' }}>
            {baixa ? <ToggleRight size={34} color={BRAND.terracotta} /> : <ToggleLeft size={34} color="#c9c4b8" />}
          </button>
        </div>

        {baixa ? (
          <div>
            <span className="label">Justificant mèdic (opcional)</span>
            <FileAttach file={file} onChange={setFile} required={false} folder={`baixes/${user.id}`} />
            {!file && (
              <div style={{ fontSize: 11, color: '#8a8478', marginTop: 6, display: 'flex', gap: 4 }}>
                <AlertCircle size={12} style={{ flexShrink: 0, marginTop: 1 }} />
                <span>Recorda adjuntar el justificant mèdic com més aviat millor.</span>
              </div>
            )}
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <span className="label">Obra</span>
              <select className="select" value={obraId} onChange={e => setObraId(e.target.value)}>
                <option value="">Selecciona una obra…</option>
                {myObres.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
              </select>
            </div>
            <div>
              <span className="label">Hores treballades</span>
              <input type="number" min="0" max="24" step="0.5" className="input" value={hores} onChange={e => setHores(e.target.value)} />
            </div>
            <div style={{ display: 'flex', gap: 20 }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14, fontWeight: 600 }}>
                <input type="checkbox" checked={dieta} onChange={e => setDieta(e.target.checked)} /> Dieta
              </label>
              <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14, fontWeight: 600 }}>
                <input type="checkbox" checked={desplacament} onChange={e => setDesplacament(e.target.checked)} /> Desplaçament
              </label>
            </div>
            <div>
              <span className="label">Comentari del treball executat</span>
              <textarea className="textarea" rows={3} value={comment} onChange={e => setComment(e.target.value)} placeholder="Breu descripció de la feina feta avui…" />
            </div>
          </div>
        )}

        <button className="btn btn-primary" style={{ width: '100%', marginTop: 16 }} disabled={!canSave} onClick={save}>
          <Check size={16} /> {saved ? 'Desat!' : 'Desa el fitxatge'}
        </button>
      </div>
    </div>
  );
}

  return (

        {mine.length === 0 && <div style={{ textAlign: 'center', color: '#8a8478', fontSize: 13, padding: 20 }}>Encara no hi ha cap fitxatge registrat.</div>}

    : <span className="badge badge-warning">Pendent</span>;

  const submit = () => {
    if (!dateFrom || !dateTo) return;
    onCreate({ workerId: user.id, type, dateFrom, dateTo, comment, file: type === 'permis' ? file : null, status: 'pendent' });
    setShowForm(false); setComment(''); setFile(null); setDateFrom(todayISO()); setDateTo(todayISO());
  };

  return (
    <div style={{ maxWidth: 560, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 16 }}>
      {!showForm ? (
        <button className="btn btn-primary" onClick={() => setShowForm(true)}><Plus size={16} /> Nova sol·licitud</button>
      ) : (
        <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ fontWeight: 800 }}>Nova sol·licitud</div>
          <div className="segmented">
            <button className={type === 'vacances' ? 'active' : ''} onClick={() => setType('vacances')}>Vacances</button>
            <button className={type === 'permis' ? 'active' : ''} onClick={() => setType('permis')}>Permís</button>
          </div>
          <div style={{ display: 'flex', gap: 10 }}>
            <div style={{ flex: 1 }}>
              <span className="label">Des de</span>
              <input type="date" className="input" value={dateFrom} onChange={e => { setDateFrom(e.target.value); if (e.target.value > dateTo) setDateTo(e.target.value); }} />
            </div>
            <div style={{ flex: 1 }}>
              <span className="label">Fins a</span>
              <input type="date" className="input" value={dateTo} min={dateFrom} onChange={e => setDateTo(e.target.value)} />
            </div>
          </div>
          <div>
            <span className="label">Comentari (opcional)</span>
            <textarea className="textarea" rows={2} value={comment} onChange={e => setComment(e.target.value)} />
          </div>
          {type === 'permis' && (
            <div>
              <span className="label">Justificant (opcional)</span>
              <FileAttach file={file} onChange={setFile} required={false} folder={`solicituds/${user.id}`} />
              <div style={{ fontSize: 11, color: '#8a8478', marginTop: 6, display: 'flex', gap: 4 }}>
                <AlertCircle size={12} style={{ flexShrink: 0, marginTop: 1 }} />
                <span>Si el permís és puntual, és recomanable adjuntar-lo el mateix dia o l'endemà.</span>
              </div>
            </div>
          )}
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setShowForm(false)}>Cancel·la</button>
            <button className="btn btn-primary" style={{ flex: 1 }} disabled={dateFrom > dateTo} onClick={submit}>Envia</button>
          </div>
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {mine.length === 0 && <div style={{ textAlign: 'center', color: '#8a8478', fontSize: 13, padding: 20 }}>Encara no has fet cap sol·licitud.</div>}
        {mine.map(s => (
          <div key={s.id} className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{s.type === 'vacances' ? 'Vacances' : 'Permís'}</div>
                <div style={{ fontSize: 12, color: '#8a8478' }}>{fmtDate(s.dateFrom)} — {fmtDate(s.dateTo)}</div>
              </div>
              {statusBadge(s.status)}
            </div>
            {s.comment && <div style={{ fontSize: 13, marginTop: 8 }}>{s.comment}</div>}
            <div style={{ marginTop: 8 }}><AttachmentViewer file={s.file} /></div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================= Centres de cost (encarregat) ============================= */
function CostCenterView({ user, obres, workers, assignacionsCC, onSave }) {
  const myObres = obres.filter(o => user.obraIds.includes(o.id));
  const [obraId, setObraId] = useState(myObres[0]?.id || '');
  const obra = obres.find(o => o.id === obraId);
  const [date, setDate] = useState(todayISO());
  const [ccId, setCcId] = useState(obra?.costCenters[0]?.id || '');
  const [selectedWorkers, setSelectedWorkers] = useState([]);

  useEffect(() => {
    const o = obres.find(x => x.id === obraId);
    setCcId(o?.costCenters[0]?.id || '');
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [obraId]);

  useEffect(() => {
    const existing = assignacionsCC.find(a => a.date === date && a.obraId === obraId && a.costCenterId === ccId);
    setSelectedWorkers(existing?.workerIds || []);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [date, obraId, ccId]);

  if (!obra) return <div className="card">No tens cap obra assignada.</div>;

  const obraWorkers = workers.filter(w => w.obraIds.includes(obraId) && w.role !== 'cap_obra');
  const todaysAssignments = assignacionsCC.filter(a => a.date === date && a.obraId === obraId);
  const toggleWorker = (wid) => setSelectedWorkers(s => s.includes(wid) ? s.filter(x => x !== wid) : [...s, wid]);
  const save = () => onSave({ date, obraId, costCenterId: ccId, workerIds: selectedWorkers });

  return (
    <div style={{ maxWidth: 640, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <div style={{ flex: '1 1 200px' }}>
            <span className="label">Obra</span>
            <select className="select" value={obraId} onChange={e => setObraId(e.target.value)}>
              {myObres.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
            </select>
          </div>
          <div style={{ flex: '1 1 140px' }}>
            <span className="label">Data</span>
            <input type="date" className="input" value={date} onChange={e => setDate(e.target.value)} />
          </div>
        </div>
        <div>
          <span className="label">Centre de cost</span>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {obra.costCenters.map(cc => (
              <button key={cc.id} className="btn" style={{ background: ccId === cc.id ? BRAND.terracotta : '#fff', color: ccId === cc.id ? '#fff' : BRAND.black, borderColor: '#d8d3c9' }} onClick={() => setCcId(cc.id)}>{cc.name}</button>
            ))}
          </div>
        </div>
        <div>
          <span className="label">Personal que ha executat aquest centre de cost</span>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 6 }}>
            {obraWorkers.map(w => (
              <label key={w.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', border: '1px solid #e7e2d8', borderRadius: 8 }}>
                <input type="checkbox" checked={selectedWorkers.includes(w.id)} onChange={() => toggleWorker(w.id)} />
                <span style={{ fontWeight: 600, fontSize: 14 }}>{w.name}</span>
              </label>
            ))}
            {obraWorkers.length === 0 && <div style={{ fontSize: 13, color: '#8a8478' }}>No hi ha personal assignat a aquesta obra.</div>}
          </div>
        </div>
        <button className="btn btn-primary" onClick={save} disabled={!ccId}>Desa l'assignació</button>
      </div>

      <div className="card">
        <div style={{ fontWeight: 800, marginBottom: 10 }}>Assignacions d'aquest dia a {obra.name}</div>
        {todaysAssignments.length === 0 && <div style={{ fontSize: 13, color: '#8a8478' }}>Encara no hi ha assignacions per aquest dia.</div>}
        {todaysAssignments.map(a => {
          const cc = obra.costCenters.find(c => c.id === a.costCenterId);
          return (
            <div key={a.id} style={{ padding: '8px 0', borderTop: '1px solid #f1ede4' }}>
              <div style={{ fontWeight: 700, fontSize: 13 }}>{cc?.name}</div>
              <div style={{ fontSize: 12, color: '#57524a' }}>{a.workerIds.map(id => workers.find(w => w.id === id)?.name).join(', ') || '—'}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================= Resum (cap d'obra) ============================= */
function ResumView({ obres, workers, fitxatges, assistencia, assignacionsCC }) {
  const [period, setPeriod] = useState('dia');
  const [obraFilter, setObraFilter] = useState('totes');
  const [date, setDate] = useState(todayISO());
  const [week, setWeek] = useState(todayISO());
  const [month, setMonth] = useState(todayISO().slice(0, 7));

  let range;
  if (period === 'dia') range = [date, date];
  else if (period === 'setmana') range = getWeekRange(week);
  else if (period === 'mes') range = getMonthRange(month);
  else range = null;

  const inRange = (d) => !range || (d >= range[0] && d <= range[1]);
  const relevantFitxatges = fitxatges.filter(f => !f.baixa && inRange(f.date) && (obraFilter === 'totes' || f.obraId === obraFilter));
  const relevantAssistencia = assistencia.filter(a => inRange(a.date) && (obraFilter === 'totes' || a.obraId === obraFilter));
  const relevantCC = assignacionsCC.filter(a => inRange(a.date) && (obraFilter === 'totes' || a.obraId === obraFilter));

  const byWorker = {};
  relevantFitxatges.forEach(f => {
    const w = workers.find(x => x.id === f.workerId);
    if (!w) return;
    if (!byWorker[w.id]) byWorker[w.id] = { name: w.name, hours: 0, rate: w.hourlyRate || 0, dietaRate: w.dietaRate || 0, despRate: w.desplacamentRate || 0, dietaCount: 0, despCount: 0, obraNames: new Set() };
    byWorker[w.id].hours += Number(f.hours) || 0;
    if (f.dieta) byWorker[w.id].dietaCount += 1;
    if (f.desplacament) byWorker[w.id].despCount += 1;
    const o = obres.find(x => x.id === f.obraId);
    if (o) byWorker[w.id].obraNames.add(o.name);
  });
  const rows = Object.values(byWorker).map(r => {
    const laborCost = r.hours * r.rate;
    const dietaCost = r.dietaCount * r.dietaRate;
    const despCost = r.despCount * r.despRate;
    return { ...r, laborCost, dietaCost, despCost, total: laborCost + dietaCost + despCost, obraNames: [...r.obraNames].join(', ') };
  });
  const totalHours = rows.reduce((s, r) => s + r.hours, 0);
  const totalGeneral = rows.reduce((s, r) => s + r.total, 0);
  const cols = obraFilter === 'totes' ? 7 : 6;

  const exportExcel = () => {
    const fitxData = relevantFitxatges.map(f => {
      const w = workers.find(x => x.id === f.workerId); const o = obres.find(x => x.id === f.obraId);
      return { Data: f.date, Treballador: w?.name || '', Obra: o?.name || '', Hores: f.hours, Dieta: f.dieta ? 'Sí' : 'No', Desplaçament: f.desplacament ? 'Sí' : 'No', Comentari: f.comment || '' };
    });
    const assistData = relevantAssistencia.map(a => {
      const w = workers.find(x => x.id === a.workerId); const o = obres.find(x => x.id === a.obraId);
      return { Data: a.date, Treballador: w?.name || '', Obra: o?.name || '', Estat: a.present ? 'Present' : 'Absent' };
    });
    const ccData = [];
    relevantCC.forEach(a => {
      const o = obres.find(x => x.id === a.obraId); const cc = o?.costCenters.find(c => c.id === a.costCenterId);
      a.workerIds.forEach(wid => {
        const w = workers.find(x => x.id === wid);
        ccData.push({ Data: a.date, Obra: o?.name || '', 'Centre de cost': cc?.name || '', Treballador: w?.name || '' });
      });
    });
    const resumData = rows.map(r => ({ Treballador: r.name, Obres: r.obraNames, Hores: r.hours, "Mà d'obra (€)": r.laborCost, 'Dietes (€)': r.dietaCost, 'Desplaçaments (€)': r.despCost, 'Total (€)': r.total }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumData), 'Resum');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fitxData), 'Fitxatges');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assistData), 'Assistencia');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ccData), 'Centres de cost');
    XLSX.writeFile(wb, `recop_dades_${range ? range.join('_a_') : 'global'}.xlsx`);
  };

  return (
    <div className="content-inner" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="card" style={{ display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'flex-end' }}>
        <div>
          <span className="label">Període</span>
          <div className="segmented">
            {['dia', 'setmana', 'mes', 'global'].map(p => (
              <button key={p} className={period === p ? 'active' : ''} onClick={() => setPeriod(p)}>{p === 'dia' ? 'Dia' : p === 'setmana' ? 'Setmana' : p === 'mes' ? 'Mes' : 'Global'}</button>
            ))}
          </div>
        </div>
        {period === 'dia' && <div><span className="label">Data</span><input type="date" className="input" value={date} onChange={e => setDate(e.target.value)} /></div>}
        {period === 'setmana' && <div><span className="label">Setmana de</span><input type="date" className="input" value={week} onChange={e => setWeek(e.target.value)} /></div>}
        {period === 'mes' && <div><span className="label">Mes</span><input type="month" className="input" value={month} onChange={e => setMonth(e.target.value)} /></div>}
        <div>
          <span className="label">Obra</span>
          <select className="select" value={obraFilter} onChange={e => setObraFilter(e.target.value)}>
            <option value="totes">Totes les obres</option>
            {obres.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
          </select>
        </div>
      </div>

      <div className="card" style={{ overflowX: 'auto' }}>
        <table className="recop-table">
          <thead><tr><th>Treballador</th>{obraFilter === 'totes' && <th>Obres</th>}<th>Hores</th><th>Mà d'obra</th><th>Dietes</th><th>Desplaç.</th><th>Total</th></tr></thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}><td>{r.name}</td>{obraFilter === 'totes' && <td>{r.obraNames}</td>}<td>{r.hours}</td><td>{fmtMoney(r.laborCost)}</td><td>{fmtMoney(r.dietaCost)}</td><td>{fmtMoney(r.despCost)}</td><td>{fmtMoney(r.total)}</td></tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={cols} style={{ color: '#8a8478', textAlign: 'center', padding: 16 }}>Sense dades per aquest període.</td></tr>}
          </tbody>
          {rows.length > 0 && (
            <tfoot><tr className="total-row"><td>Total</td>{obraFilter === 'totes' && <td />}<td>{totalHours}</td><td /><td /><td /><td>{fmtMoney(totalGeneral)}</td></tr></tfoot>
          )}
        </table>
      </div>

      <div className="card">
        <div style={{ fontWeight: 800, marginBottom: 10 }}>Exportar dades</div>
        <button className="btn btn-outline" onClick={exportExcel}><Download size={14} /> Exporta a Excel (.xlsx)</button>
        <div style={{ fontSize: 12, color: '#8a8478', marginTop: 8 }}>Inclou pestanyes de Resum, Fitxatges, Assistència i Centres de cost pel període i obra seleccionats — llest per a taules dinàmiques.</div>
      </div>
    </div>
  );
}

/* ============================= Obres (cap d'obra) ============================= */
function ObresView({ obres, onSave }) {
  const blank = { id: null, name: '', address: '', active: true, costCenters: [] };
  const [editingId, setEditingId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [form, setForm] = useState(blank);
  const [newCC, setNewCC] = useState('');

  const startEdit = (o) => { setForm({ ...o, costCenters: [...o.costCenters] }); setEditingId(o.id); setShowNew(false); };
  const startNew = () => { setForm({ ...blank, id: uid() }); setShowNew(true); setEditingId(null); };
  const addCC = () => { if (!newCC.trim()) return; setForm(f => ({ ...f, costCenters: [...f.costCenters, { id: uid(), name: newCC.trim() }] })); setNewCC(''); };
  const removeCC = (id) => setForm(f => ({ ...f, costCenters: f.costCenters.filter(c => c.id !== id) }));
  const save = () => { if (!form.name.trim()) return; onSave(form); setEditingId(null); setShowNew(false); setForm(blank); };

  return (
    <div className="content-inner" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <button className="btn btn-primary" style={{ alignSelf: 'flex-start' }} onClick={startNew}><Plus size={16} /> Nova obra</button>

      {(showNew || editingId) && (
        <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 480 }}>
          <div style={{ fontWeight: 800 }}>{editingId ? 'Edita obra' : 'Nova obra'}</div>
          <div><span className="label">Nom de l'obra</span><input className="input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></div>
          <div><span className="label">Adreça</span><input className="input" value={form.address} onChange={e => setForm(f => ({ ...f, address: e.target.value }))} /></div>
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14, fontWeight: 600 }}>
            <input type="checkbox" checked={form.active} onChange={e => setForm(f => ({ ...f, active: e.target.checked }))} /> Obra activa
          </label>
          <div>
            <span className="label">Centres de cost</span>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 8 }}>
              {form.costCenters.map(cc => <span key={cc.id} className="chip">{cc.name} <X size={12} style={{ cursor: 'pointer' }} onClick={() => removeCC(cc.id)} /></span>)}
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <input className="input" placeholder="Nom del centre de cost" value={newCC} onChange={e => setNewCC(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCC()} />
              <button className="btn btn-secondary" onClick={addCC}>Afegeix</button>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => { setEditingId(null); setShowNew(false); }}>Cancel·la</button>
            <button className="btn btn-primary" style={{ flex: 1 }} onClick={save}>Desa</button>
          </div>
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px,1fr))', gap: 12 }}>
        {obres.map(o => (
          <div key={o.id} className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
              <div>
                <div style={{ fontWeight: 800 }}>{o.name}</div>
                <div style={{ fontSize: 12, color: '#8a8478' }}>{o.address}</div>
              </div>
              <span className={`badge ${o.active ? 'badge-success' : 'badge-neutral'}`}>{o.active ? 'Activa' : 'Inactiva'}</span>
            </div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10 }}>
              {o.costCenters.map(cc => <span key={cc.id} className="chip">{cc.name}</span>)}
            </div>
            <button className="btn btn-ghost" style={{ marginTop: 12 }} onClick={() => startEdit(o)}><Pencil size={14} /> Edita</button>
          </div>
        ))}
      </div>
    </div>
  );
}

  const [form, setForm] = useState(blank);
  const [importMsg, setImportMsg] = useState('');

  const startEdit = (w) => { setForm({ ...w, obraIds: [...w.obraIds] }); setEditingId(w.id); setShowNew(false); };
  const startNew = () => { setForm({ ...blank, id: uid() }); setShowNew(true); setEditingId(null); };
  const toggleObra = (oid) => setForm(f => ({ ...f, obraIds: f.obraIds.includes(oid) ? f.obraIds.filter(x => x !== oid) : [...f.obraIds, oid] }));

  const save = () => {
    if (!form.name.trim() || !/^\d{4}$/.test(form.pin)) return;
    onSave(form);
    setEditingId(null); setShowNew(false); setForm(blank);
  };

  const roleFromLabel = (raw) => {
    const v = String(raw || '').trim().toLowerCase();
    if (v.startsWith('encarregat')) return 'encarregat';
    if (v.startsWith('cap')) return 'cap_obra';
    return 'treballador';
  };

  const handleImport = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      const created = json.map(row => {
        const name = String(row['Nom'] ?? row['nom'] ?? '').trim();
        if (!name) return null;
        let pin = String(row['PIN'] ?? row['pin'] ?? '').replace(/\D/g, '').slice(0, 4);
        if (pin.length !== 4) pin = String(1000 + Math.floor(Math.random() * 9000));
        const role = roleFromLabel(row['Rol'] ?? row['rol']);
        const hourlyRate = Number(row['Preu hora'] ?? row["Preu/hora"] ?? 0) || 0;
        const dietaRate = Number(row['Preu dieta'] ?? 0) || 0;
        const desplacamentRate = Number(row['Preu desplaçament'] ?? row['Preu desplacament'] ?? 0) || 0;
        const obresRaw = String(row['Obres'] ?? row['obres'] ?? '').trim();
        const obraIds = obresRaw
          ? obresRaw.split(',').map(s => s.trim().toLowerCase())
            .map(n => obres.find(o => o.name.toLowerCase() === n)?.id).filter(Boolean)
          : [];
        return { id: uid(), name, pin, role, hourlyRate, dietaRate, desplacamentRate, obraIds };
      }).filter(Boolean);
      await onImport(created);
      setImportMsg(`S'han importat ${created.length} treballadors.`);
    } catch (err) {
      console.error(err);
      setImportMsg("No s'ha pogut llegir el fitxer. Comprova el format.");
    }
    e.target.value = '';
    setTimeout(() => setImportMsg(''), 5000);
  };

  return (
    <div className="content-inner" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
        <button className="btn btn-primary" onClick={startNew}><Plus size={16} /> Nou treballador</button>
        <label className="btn btn-outline" style={{ cursor: 'pointer' }}>
          <Upload size={16} /> Importa des d'Excel
          <input type="file" accept=".xlsx,.xls,.csv" style={{ display: 'none' }} onChange={handleImport} />
        </label>
        {importMsg && <span className="badge badge-neutral">{importMsg}</span>}
      </div>
      <div style={{ fontSize: 12, color: '#8a8478', marginTop: -8 }}>
        Columnes esperades: <strong>Nom, PIN, Rol, Preu hora, Preu dieta, Preu desplaçament, Obres</strong> (Obres separades per comes, amb el mateix nom que a l'apartat Obres).
      </div>

      {(showNew || editingId) && (
        <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 480 }}>
          <div style={{ fontWeight: 800 }}>{editingId ? 'Edita treballador' : 'Nou treballador'}</div>
          <div><span className="label">Nom complet</span><input className="input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></div>
          <div>
            <span className="label">PIN (4 dígits)</span>
            <input className="input" maxLength={4} value={form.pin} onChange={e => setForm(f => ({ ...f, pin: e.target.value.replace(/\D/g, '').slice(0, 4) }))} />
            {!/^\d{4}$/.test(form.pin) && <div style={{ fontSize: 11, color: '#8a8478', marginTop: 4 }}>Ha de tenir 4 dígits.</div>}
          </div>
          <div>
            <span className="label">Rol</span>
            <select className="select" value={form.role} onChange={e => setForm(f => ({ ...f, role: e.target.value }))}>
              <option value="treballador">Treballador</option>
              <option value="encarregat">Encarregat</option>
              <option value="cap_obra">Cap d'obra</option>
            </select>
          </div>
          <div><span className="label">Preu/hora (€)</span><input type="number" step="0.5" className="input" value={form.hourlyRate} onChange={e => setForm(f => ({ ...f, hourlyRate: e.target.value }))} /></div>
          <div><span className="label">Preu dieta (€/dia)</span><input type="number" step="0.5" className="input" value={form.dietaRate} onChange={e => setForm(f => ({ ...f, dietaRate: e.target.value }))} /></div>
          <div><span className="label">Preu desplaçament (€/dia)</span><input type="number" step="0.5" className="input" value={form.desplacamentRate} onChange={e => setForm(f => ({ ...f, desplacamentRate: e.target.value }))} /></div>
          <div>
            <span className="label">Obres assignades</span>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {obres.map(o => (
                <label key={o.id} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 14 }}>
                  <input type="checkbox" checked={form.obraIds.includes(o.id)} onChange={() => toggleObra(o.id)} /> {o.name}
                </label>
              ))}
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => { setEditingId(null); setShowNew(false); }}>Cancel·la</button>
            <button className="btn btn-primary" style={{ flex: 1 }} onClick={save}>Desa</button>
          </div>
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px,1fr))', gap: 12 }}>
        {workers.map(w => (
          <div key={w.id} className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}>
              <div style={{ fontWeight: 800 }}>{w.name}</div>
              <span className={`badge ${w.role === 'cap_obra' ? 'badge-terracotta' : w.role === 'encarregat' ? 'badge-olive' : 'badge-neutral'}`}>{ROLE_LABEL[w.role]}</span>
            </div>
            <div style={{ fontSize: 12, color: '#8a8478', marginTop: 4 }}>{fmtMoney(w.hourlyRate)}/h · Dieta {fmtMoney(w.dietaRate || 0)} · Desp. {fmtMoney(w.desplacamentRate || 0)}</div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 8 }}>
              {w.obraIds.map(oid => { const o = obres.find(x => x.id === oid); return o ? <span key={oid} className="chip">{o.name}</span> : null; })}
            </div>
            <button className="btn btn-ghost" style={{ marginTop: 12 }} onClick={() => startEdit(w)}><Pencil size={14} /> Edita</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================= Sol·licituds admin (cap d'obra) ============================= */
function SolicitudsAdminView({ workers, solicituds, fitxatges, onDecision }) {
  const [tab, setTab] = useState('pendents');
  const withNames = solicituds.map(s => ({ ...s, workerName: workers.find(w => w.id === s.workerId)?.name || '—' })).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const list = tab === 'pendents' ? withNames.filter(s => s.status === 'pendent') : withNames;
  const baixes = fitxatges.filter(f => f.baixa).map(f => ({ ...f, workerName: workers.find(w => w.id === f.workerId)?.name || '—' })).sort((a, b) => b.date.localeCompare(a.date));

  return (
    <div className="content-inner" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="segmented" style={{ alignSelf: 'flex-start' }}>
        <button className={tab === 'pendents' ? 'active' : ''} onClick={() => setTab('pendents')}>Pendents</button>
        <button className={tab === 'totes' ? 'active' : ''} onClick={() => setTab('totes')}>Totes</button>
        <button className={tab === 'baixes' ? 'active' : ''} onClick={() => setTab('baixes')}>Baixes mèdiques</button>
      </div>

      {tab !== 'baixes' ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {list.length === 0 && <div style={{ color: '#8a8478', fontSize: 13, textAlign: 'center', padding: 20 }}>Cap sol·licitud.</div>}
          {list.map(s => (
            <div key={s.id} className="card">
              <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 700 }}>{s.workerName} · {s.type === 'vacances' ? 'Vacances' : 'Permís'}</div>
                  <div style={{ fontSize: 12, color: '#8a8478' }}>{fmtDate(s.dateFrom)} — {fmtDate(s.dateTo)}</div>
                </div>
                <span className={`badge ${s.status === 'aprovada' ? 'badge-success' : s.status === 'rebutjada' ? 'badge-danger' : 'badge-warning'}`}>
                  {s.status === 'aprovada' ? 'Aprovada' : s.status === 'rebutjada' ? 'Rebutjada' : 'Pendent'}
                </span>
              </div>
              {s.comment && <div style={{ fontSize: 13, marginTop: 6 }}>{s.comment}</div>}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10, flexWrap: 'wrap', gap: 8 }}>
                <AttachmentViewer file={s.file} />
                {s.status === 'pendent' && (
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button className="btn btn-danger" style={{ padding: '6px 12px' }} onClick={() => onDecision(s.id, 'rebutjada')}>Rebutja</button>
                    <button className="btn btn-primary" style={{ padding: '6px 12px' }} onClick={() => onDecision(s.id, 'aprovada')}>Aprova</button>
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {baixes.length === 0 && <div style={{ color: '#8a8478', fontSize: 13, textAlign: 'center', padding: 20 }}>Cap baixa registrada.</div>}
          {baixes.map(b => (
            <div key={b.id} className="card">
              <div style={{ fontWeight: 700 }}>{b.workerName}</div>
              <div style={{ fontSize: 12, color: '#8a8478', marginBottom: 8 }}>{fmtDate(b.date)}</div>
              <AttachmentViewer file={b.file} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================= App ============================= */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState('');
  const [workers, setWorkers] = useState([]);
  const [obres, setObres] = useState([]);
  const [fitxatges, setFitxatges] = useState([]);
  const [solicituds, setSolicituds] = useState([]);
  const [notificacions, setNotificacions] = useState([]);
  const [assignacionsCC, setAssignacionsCC] = useState([]);
  const [assistencia, setAssistencia] = useState([]);
  const [user, setUser] = useState(null);
  const [tab, setTab] = useState('fitxatge');

  useEffect(() => {
    (async () => {
      const [w, o, f, s, n, cc, a] = await Promise.all([
        supabaseClient.from('workers').select('*'),
        supabaseClient.from('obres').select('*'),
        supabaseClient.from('fitxatges').select('*'),
        supabaseClient.from('solicituds').select('*'),
        supabaseClient.from('notificacions').select('*'),
        supabaseClient.from('assignacions_cc').select('*'),
        supabaseClient.from('assistencia').select('*'),
      ]);
      const firstError = [w, o, f, s, n, cc, a].find(r => r.error);
      if (firstError) {
        console.error(firstError.error);
        const detail = firstError.error?.message || firstError.error?.hint || '';
        let msg;
        if (/schema cache/i.test(detail)) {
          msg = "Supabase no troba les taules d'aquest projecte. Això vol dir una d'aquestes dues coses:\n\n"
            + "1) El fitxer supabase/schema.sql encara no s'ha executat en AQUEST projecte concret (Dashboard → SQL Editor → Run).\n"
            + "2) Ja s'ha executat, però cal refrescar la memòria cau de l'API: torna a obrir el SQL Editor i executa NOTIFY pgrst, 'reload schema'; i prova de nou al cap d'uns segons.\n\n"
            + "Comprova també, a Project Settings → API, que la 'Project URL' coincideixi exactament amb la que hi ha a l'inici de index.html.";
        } else if (/permission denied/i.test(detail)) {
          msg = "Les taules existeixen, però falten permisos per a la clau pública. Executa això al SQL Editor de Supabase i torna-ho a provar:\n\n"
            + "grant usage on schema public to anon, authenticated;\n"
            + "grant select, insert, update, delete on all tables in schema public to anon, authenticated;\n"
            + "grant usage, select on all sequences in schema public to anon, authenticated;";
        } else {
          msg = "No s'han pogut carregar les dades des de Supabase. Comprova que el projecte no estigui en pausa (Supabase Dashboard) i que la URL i la clau siguin correctes a l'inici del fitxer index.html.";
        }
        setLoadError(msg + (detail ? ('\n\nDetall tècnic: ' + detail) : ''));
      }
      const workersData = (w.data || []).map(workerFromRow).sort((a, b) => a.name.localeCompare(b.name, 'ca'));
      setWorkers(workersData);
      setObres((o.data || []).map(obraFromRow));
      setFitxatges((f.data || []).map(fitxatgeFromRow));
      setSolicituds((s.data || []).map(solicitudFromRow));
      setNotificacions((n.data || []).map(notifFromRow));
      setAssignacionsCC((cc.data || []).map(ccFromRow));
      setAssistencia((a.data || []).map(assistFromRow));

      let savedId = null;
      try { savedId = window.localStorage.getItem(SESSION_KEY); } catch (e) { /* ignore */ }
      if (savedId) {
        const found = workersData.find(x => x.id === savedId);
        if (found) { setUser(found); setTab(defaultTabForRole(found.role)); }
      }
      setLoaded(true);
    })();
  }, []);

  const notify = async (workerId, message) => {
    const { data, error } = await supabaseClient.from('notificacions').insert({ worker_id: workerId, message }).select().single();
    if (error) { console.error(error); return; }
    setNotificacions(prev => [...prev, notifFromRow(data)]);
  };
  const notifyRole = async (role, message) => {
    const targets = workers.filter(w => w.role === role);
    if (targets.length === 0) return;
    const rows = targets.map(w => ({ worker_id: w.id, message }));
    const { data, error } = await supabaseClient.from('notificacions').insert(rows).select();
    if (error) { console.error(error); return; }
    setNotificacions(prev => [...prev, ...data.map(notifFromRow)]);
  };

  const handleFitxatgeSave = async (entry) => {
    const row = fitxatgeToRow(entry);
    const { data, error } = await supabaseClient.from('fitxatges').upsert(row, { onConflict: 'worker_id,date' }).select().single();
    if (error) { console.error(error); return; }
    const saved = fitxatgeFromRow(data);
    setFitxatges(prev => [...prev.filter(f => !(f.workerId === saved.workerId && f.date === saved.date)), saved]);
  };

  const handleSolicitudCreate = async (s) => {
    const row = solicitudToRow(s);
    const { data, error } = await supabaseClient.from('solicituds').insert(row).select().single();
    if (error) { console.error(error); return; }
    setSolicituds(prev => [...prev, solicitudFromRow(data)]);
    notifyRole('cap_obra', `Nova sol·licitud de ${user?.name} (${s.type === 'vacances' ? 'vacances' : 'permís'})`);
  };

  const handleSolicitudDecision = async (id, status) => {
    const { data, error } = await supabaseClient.from('solicituds').update({ status }).eq('id', id).select().single();
    if (error) { console.error(error); return; }
    const updated = solicitudFromRow(data);
    setSolicituds(prev => prev.map(x => x.id === id ? updated : x));
    notify(updated.workerId, `La teva sol·licitud de ${updated.type === 'vacances' ? 'vacances' : 'permís'} (${fmtDate(updated.dateFrom)} — ${fmtDate(updated.dateTo)}) ha estat ${status === 'aprovada' ? 'aprovada' : 'rebutjada'}.`);
  };

  const handleAssignacioCC = async (entry) => {
    const row = ccToRow(entry);
    const { data, error } = await supabaseClient.from('assignacions_cc').upsert(row, { onConflict: 'date,obra_id,cost_center_id' }).select().single();
    if (error) { console.error(error); return; }
    const saved = ccFromRow(data);
    setAssignacionsCC(prev => [...prev.filter(a => !(a.date === saved.date && a.obraId === saved.obraId && a.costCenterId === saved.costCenterId)), saved]);
  };

  const handleMarkAssistencia = async (workerId, obraId, date, present) => {
    const row = assistToRow({ date, obraId, workerId, present, markedBy: user?.id });
    const { data, error } = await supabaseClient.from('assistencia').upsert(row, { onConflict: 'date,obra_id,worker_id' }).select().single();
    if (error) { console.error(error); return; }
    const saved = assistFromRow(data);
    setAssistencia(prev => [...prev.filter(a => !(a.workerId === saved.workerId && a.obraId === saved.obraId && a.date === saved.date)), saved]);
  };

  const handleObraSave = async (obra) => {
    const isNew = !obres.some(o => o.id === obra.id);
    const row = { ...obraToRow(obra), id: obra.id || uid() };
    const { data, error } = await supabaseClient.from('obres').upsert(row).select().single();
    if (error) { console.error(error); return; }
    const saved = obraFromRow(data);
    setObres(prev => isNew ? [...prev, saved] : prev.map(o => o.id === saved.id ? saved : o));
  };

  const handleRoleChange = (w, prevRole) => {
    notify(w.id, `Se t'ha assignat el rol de ${ROLE_LABEL[w.role]}.`);
    if (prevRole === 'encarregat' && w.role !== 'encarregat') notify(w.id, `Se t'han retirat les funcions d'Encarregat.`);
  };

  const handleWorkerSave = async (w) => {
    const isNew = !workers.some(x => x.id === w.id);
    const row = { ...workerToRow(w), id: w.id || uid() };
    const { data, error } = await supabaseClient.from('workers').upsert(row).select().single();
    if (error) { console.error(error); return; }
    const saved = workerFromRow(data);
    const prevWorker = workers.find(x => x.id === saved.id);
    setWorkers(prev => (isNew ? [...prev, saved] : prev.map(x => x.id === saved.id ? saved : x)).sort((a, b) => a.name.localeCompare(b.name, 'ca')));
    if (prevWorker && prevWorker.role !== saved.role) handleRoleChange(saved, prevWorker.role);
  };

  const handleWorkersImport = async (list) => {
    if (list.length === 0) return;
    const rows = list.map(w => ({ ...workerToRow(w), id: w.id || uid() }));
    const { data, error } = await supabaseClient.from('workers').insert(rows).select();
    if (error) { console.error(error); return; }
    const saved = data.map(workerFromRow);
    setWorkers(prev => [...prev, ...saved].sort((a, b) => a.name.localeCompare(b.name, 'ca')));
  };

  const handleMarkNotifRead = async (id) => {
    const { error } = await supabaseClient.from('notificacions').update({ read: true }).eq('id', id);
    if (error) { console.error(error); return; }
    setNotificacions(prev => prev.map(n => n.id === id ? { ...n, read: true } : n));
  };

  const handleLogin = (w) => {
    setUser(w);
    setTab(defaultTabForRole(w.role));
    try { window.localStorage.setItem(SESSION_KEY, w.id); } catch (e) { /* ignore */ }
  };
  const handleLogout = () => {
    setUser(null);
    try { window.localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
  };

  if (!loaded) {
    return (<div className="recop-app" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh' }}><GlobalStyles /><div style={{ color: '#8a8478' }}>Carregant…</div></div>);
  }
  if (loadError) {
    return (<div className="recop-app" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', padding: 24, textAlign: 'center' }}><GlobalStyles /><div style={{ color: BRAND.terracotta, fontWeight: 700, maxWidth: 480, whiteSpace: 'pre-wrap' }}>{loadError}</div></div>);
  }
  if (!user) {
    return (<><GlobalStyles /><LoginScreen workers={workers} onLogin={handleLogin} /></>);
  }

  const myNotifs = notificacions.filter(n => n.workerId === user.id);
  const navItems = {
    treballador: [
      { key: 'fitxatge', label: 'Fitxatge', icon: Clock },
      { key: 'historial', label: 'Historial', icon: History },
      { key: 'solicituds', label: 'Sol·licituds', icon: FileText },
    ],
    encarregat: [
      { key: 'fitxatge', label: 'Fitxatge', icon: Clock },
      { key: 'centres', label: 'Centres', icon: Briefcase },
      { key: 'assistencia', label: 'Assistència', icon: Users },
      { key: 'solicituds', label: 'Sol·licituds', icon: FileText },
    ],
    cap_obra: [
      { key: 'resum', label: 'Resum', icon: Home },
      { key: 'obres', label: 'Obres', icon: Building2 },
      { key: 'personal', label: 'Personal', icon: Users },
      { key: 'solicituds_admin', label: 'Sol·licituds', icon: FileText },
    ],
  }[user.role];

  const renderContent = () => {
    if (user.role === 'treballador') {
      if (tab === 'fitxatge') return <FitxatgeView user={user} obres={obres} fitxatges={fitxatges} onSave={handleFitxatgeSave} />;
      if (tab === 'historial') return <HistorialView user={user} obres={obres} fitxatges={fitxatges} />;
      if (tab === 'solicituds') return <SolicitudsView user={user} solicituds={solicituds} onCreate={handleSolicitudCreate} />;
    }
    if (user.role === 'encarregat') {
      if (tab === 'fitxatge') return <FitxatgeView user={user} obres={obres} fitxatges={fitxatges} onSave={handleFitxatgeSave} />;
      if (tab === 'centres') return <CostCenterView user={user} obres={obres} workers={workers} assignacionsCC={assignacionsCC} onSave={handleAssignacioCC} />;
      if (tab === 'assistencia') return <AssistenciaView user={user} obres={obres} workers={workers} fitxatges={fitxatges} solicituds={solicituds} assistencia={assistencia} onMark={handleMarkAssistencia} />;
      if (tab === 'solicituds') return <SolicitudsView user={user} solicituds={solicituds} onCreate={handleSolicitudCreate} />;
    }
    if (user.role === 'cap_obra') {
      if (tab === 'resum') return <ResumView obres={obres} workers={workers} fitxatges={fitxatges} assistencia={assistencia} assignacionsCC={assignacionsCC} />;
      if (tab === 'obres') return <ObresView obres={obres} onSave={handleObraSave} />;
      if (tab === 'personal') return <PersonalView workers={workers} obres={obres} onSave={handleWorkerSave} onImport={handleWorkersImport} />;
      if (tab === 'solicituds_admin') return <SolicitudsAdminView workers={workers} solicituds={solicituds} fitxatges={fitxatges} onDecision={handleSolicitudDecision} />;
    }
    return null;
  };

  return (
    <div className="recop-app">
